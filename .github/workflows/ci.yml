name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      package: ${{ steps.filter.outputs.package }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'ci/local_check.sh'
              - '.github/workflows/**'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.config/nextest.toml'
              - 'ci/**'
              - 'install.sh'
              - 'install.ps1'
              - '.github/workflows/**'
            package:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'README.md'
              - 'LICENSE'
              - 'ci/crate_publish_order.sh'
              - 'ci/local_check.sh'
              - '.github/workflows/**'

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/_reusable_rust.yml
    with:
      command: |
        bash ci/local_check.sh policy
        bash ci/local_check.sh rust-lint

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/_reusable_rust.yml
    with:
      command: bash ci/local_check.sh rust-test
      playwright: true

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/automate-hub/package-lock.json
      - run: bash ci/local_check.sh frontend

  installer-syntax:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer scripts
        shell: bash
        run: |
          set -euo pipefail
          sh -n install.sh
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content ./install.ps1 -Raw))'
          else
            echo "pwsh is not available; skipping PowerShell parser check."
          fi

  package-dry-run:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/_reusable_rust.yml
    with:
      command: bash ci/local_check.sh package
