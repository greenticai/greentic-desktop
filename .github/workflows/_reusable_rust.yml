name: Reusable Rust

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      playwright:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        if: inputs.playwright
        with:
          tool: nextest@0.9.132
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/automate-hub/package-lock.json
      - name: Install Linux native automation dependencies
        run: bash ci/install_linux_native_deps.sh
      - name: Install frontend automation dependencies
        if: inputs.playwright
        run: |
          cd frontend/automate-hub
          npm ci --no-audit --no-fund
          npx playwright install-deps chromium
      - name: Cache Playwright browser
        if: inputs.playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/automate-hub/package-lock.json') }}
      - name: Install Playwright browser
        if: inputs.playwright && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend/automate-hub
        run: npx playwright install chromium
      - uses: Swatinem/rust-cache@v2
      - name: Run command
        shell: bash
        run: ${{ inputs.command }}
